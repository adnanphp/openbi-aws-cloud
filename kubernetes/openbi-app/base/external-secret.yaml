# Database credentials, synced from AWS Secrets Manager.
#
# External Secrets Operator reads the secret at openbi/dev/db and
# creates a Kubernetes Secret named "openbi-db-credentials" in the
# openbi namespace.
#
# RDS creates the secret automatically when the instance is provisioned
# with manage_master_user_password = true. The secret contains a JSON
# object with username, password, host, port, and dbname.

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: openbi-db-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: openbi-db-credentials
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: openbi/dev/db
