
ClusterSecretStore — how ESO reaches AWS Secrets Manager.
This resource tells External Secrets Operator to use the IRSA role
attached to its ServiceAccount when reading secrets.
Applied once per cluster:
kubectl apply -f kubernetes/external-secrets/cluster-secret-store.yaml
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
name: aws-secrets-manager
labels:
app.kubernetes.io/name: external-secrets
app.kubernetes.io/part-of: openbi-platform
spec:
provider:
aws:
service: SecretsManager
region: eu-central-1
auth:
jwt:

The ServiceAccount whose IRSA role ESO assumes.
serviceAccountRef:
name: external-secrets
namespace: external-secrets
