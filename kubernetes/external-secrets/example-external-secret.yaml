
Example ExternalSecret.
Creates a Kubernetes Secret in the openbi namespace by reading from
AWS Secrets Manager.
Applied with:
kubectl apply -f kubernetes/external-secrets/example-external-secret.yaml
This is a reference example. The actual ExternalSecrets are created in
Phase A10 alongside the services that consume them.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
name: example-secret
namespace: openbi
labels:
app.kubernetes.io/part-of: openbi-platform
spec:
refreshInterval: 1h
secretStoreRef:
name: aws-secrets-manager
kind: ClusterSecretStore
target:
name: example-secret
creationPolicy: Owner
data:

secretKey: value
remoteRef:

Replace with a real secret path in Secrets Manager
key: openbi/dev/example
property: value
