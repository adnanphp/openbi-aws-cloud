
ServiceAccount for the AWS Load Balancer Controller.
The Helm install (see README.md) creates this ServiceAccount with the
role ARN annotation. This file is included for reference and for
cases where you want to manage the ServiceAccount manually.
IMPORTANT: replace ACCOUNT_ID with the real AWS account ID and
ROLE_NAME with the role created by the terraform/modules/alb module.
apiVersion: v1
kind: ServiceAccount
metadata:
name: aws-load-balancer-controller
namespace: kube-system
annotations:
eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/ROLE_NAME
labels:
app.kubernetes.io/name: aws-load-balancer-controller
app.kubernetes.io/component: controller
app.kubernetes.io/part-of: openbi-platform
