# Namespaces used by the OpenBI EKS deployment.
#
# Applied via `kubectl apply -f kubernetes/namespaces/`.
#
# Labels follow the Kubernetes recommended labels convention
# (app.kubernetes.io/*) for consistency with tooling.

apiVersion: v1
kind: Namespace
metadata:
  name: openbi
  labels:
    app.kubernetes.io/name: openbi
    app.kubernetes.io/part-of: openbi-platform
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    app.kubernetes.io/name: monitoring
    app.kubernetes.io/part-of: openbi-platform
---
apiVersion: v1
kind: Namespace
metadata:
  name: logging
  labels:
    app.kubernetes.io/name: logging
    app.kubernetes.io/part-of: openbi-platform
